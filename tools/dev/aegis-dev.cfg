// Aegis - cargador de desarrollo (esta primera linea la ignora Firefox).
// SOLO en copias de prueba: lo instala `aegis.py instalar-prueba` y nunca va en una version publicada.
// En cada arranque lee del repo las prefs (settings/prefs) y el codigo de interfaz
// (overlay/browser/components/aegis): un cambio se ve al reiniciar Aegis, sin compilar.
// La constante REPO la pone aegis.py con la ruta de Windows del repo.
// Deja lo que hace (y cualquier fallo) en aegis-dev.log, junto al ejecutable.
// (Sin tildes: Firefox no garantiza la codificacion con que lee este archivo.)
var aegisDevLog = function (texto) {
  try {
    var f = Services.dirsvc.get("GreD", Components.interfaces.nsIFile);
    f.append("aegis-dev.log");
    var s = Components.classes["@mozilla.org/network/file-output-stream;1"].createInstance(
      Components.interfaces.nsIFileOutputStream
    );
    s.init(f, 0x02 | 0x08 | 0x10, 0o644, 0); // escritura, crear, anadir
    // Solo ASCII (en este contexto no hay TextEncoder): lo demas, como «?».
    var linea = (new Date().toISOString() + " " + texto + "\n").replace(/[^\x09\x0a\x20-\x7e]/g, "?");
    s.write(linea, linea.length);
    s.close();
  } catch (e) {
    // sin registro: no hay nada mas que hacer
  }
};

try {
  aegisDevLog("cargador: inicio");
  const REPO = @REPO_WIN@;
  const { classes: Cc, interfaces: Ci, utils: Cu } = Components;
  const archivo = (...partes) => {
    const f = Cc["@mozilla.org/file/local;1"].createInstance(Ci.nsIFile);
    f.initWithPath(REPO);
    for (const p of partes) {
      f.append(p);
    }
    return f;
  };

  // 1. Prefs de settings/prefs, en orden, como valores por defecto (igual que en la build).
  const marca = JSON.parse(Cu.readUTF8File(archivo("branding", "marca.json")));
  const nombres = [];
  const entradas = archivo("settings", "prefs").directoryEntries;
  while (entradas.hasMoreElements()) {
    const f = entradas.nextFile;
    if (f.leafName.endsWith(".js")) {
      nombres.push(f.leafName);
    }
  }
  nombres.sort();
  // Sin evaluar codigo (la CSP del sistema bloquea Function/eval): cada linea pref("nombre", valor); se lee con
  // una expresion regular y JSON.parse. settings/prefs solo usa literales (true/false, numeros, "texto").
  const LINEA = /^\s*(?:pref|sticky_pref)\(\s*("(?:[^"\\]|\\.)*")\s*,\s*(.+?)\s*\)\s*;/;
  let total = 0;
  for (const n of nombres) {
    const texto = Cu.readUTF8File(archivo("settings", "prefs", n)).replaceAll(
      "@REPO@",
      marca.publicacion.github
    );
    for (const l of texto.split("\n")) {
      const m = LINEA.exec(l);
      if (!m) {
        continue;
      }
      try {
        defaultPref(JSON.parse(m[1]), JSON.parse(m[2]));
        total++;
      } catch (e) {
        aegisDevLog(`prefs: ${n}: no se pudo leer «${l.trim()}»: ${e}`);
      }
    }
  }
  aegisDevLog(`prefs: ${total} de ${nombres.length} archivos`);

  // 2. Interfaz: overlay/browser/components/aegis/ del repo se copia en cada arranque a aegis-dev/, junto al
  // ejecutable, y resource://aegis/ apunta a esa copia. Copia y no el repo directamente porque el sandbox de los
  // procesos de contenido (nueva pestaña, navegación privada) no deja leer Documentos, y sí la carpeta del
  // navegador. Si existe AegisArranque.sys.mjs, se llama a inicio() una vez y a ventana(win) en cada ventana.
  const origen = archivo("overlay", "browser", "components", "aegis");
  if (archivo("overlay", "browser", "components", "aegis", "AegisArranque.sys.mjs").exists()) {
    const base = Services.dirsvc.get("GreD", Ci.nsIFile);
    base.append("aegis-dev");
    // La instancia con Tor (perfil aegis-tor/perfil, tor/tor.sys.mjs) se abre desde una copia ya en marcha: usa la
    // misma copia sin volver a hacerla, para no tocar los archivos que esa otra copia esta usando.
    let perfil = "";
    try {
      perfil = Services.dirsvc.get("ProfD", Ci.nsIFile).path;
    } catch (e) {
      // sin perfil todavia: se copia como siempre
    }
    const instanciaTor = /[\\/]aegis-tor[\\/]perfil$/.test(perfil) && base.exists();
    if (!instanciaTor) {
      try {
        if (base.exists()) {
          base.remove(true);
        }
        origen.copyTo(base.parent, "aegis-dev");
      } catch (e) {
        // Otra copia en marcha tiene archivos abiertos: si queda la copia anterior, se usa esa.
        aegisDevLog("interfaz: no se pudo rehacer la copia (" + e + ")");
        if (!base.exists()) {
          throw e;
        }
      }
    } else {
      aegisDevLog("interfaz: instancia con Tor, se usa la copia que ya hay");
    }
    Services.io
      .getProtocolHandler("resource")
      .QueryInterface(Ci.nsIResProtocolHandler)
      .setSubstitution("aegis", Services.io.newFileURI(base));
    const cargar = () =>
      ChromeUtils.importESModule("resource://aegis/AegisArranque.sys.mjs").AegisArranque;
    const seguro = (que, fn) => {
      try {
        fn();
        aegisDevLog(que + ": hecho");
      } catch (e) {
        aegisDevLog(`${que}: FALLO ${e}\n${e?.stack ?? ""}`);
      }
    };
    Services.obs.addObserver(() => seguro("inicio", () => cargar().inicio?.()), "final-ui-startup");
    Services.obs.addObserver(
      win => seguro("ventana", () => cargar().ventana?.(win)),
      "browser-delayed-startup-finished"
    );
    aegisDevLog("interfaz: copia de " + origen.path + " en " + base.path);
  }
} catch (e) {
  aegisDevLog(`cargador: FALLO ${e}\n${e?.stack ?? ""}`);
}
