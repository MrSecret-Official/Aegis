<!-- Aegis · about:bienvenida (bienvenida.sys.mjs): las preguntas de Aegis Setup (modo, Escudos, buscador y apariencia)
     dentro del navegador, para quien no pasa por el instalador (Microsoft Store, zip). Sale en el primer arranque de un
     perfil nuevo sin el archivo del instalador, antes de about:conexiones, y lleva a ella al terminar. Mismo aspecto que
     el asistente (packaging/instalador/ui/instalador.slint, DISENO §9 «Instalador»): pasos con icono en círculo,
     tarjetas con miniatura, rejilla del buscador y el pie con los pasos en rayitas.
     Sin scripts: las tarjetas son radios nativos y bienvenida.sys.mjs los atiende desde el proceso padre (pasos, pie,
     flechas, aplicar). Los textos, Fluent (locales/<idioma>/aegis.ftl); las hojas, AegisArranque (tokens.css, comun.css
     y paginas/bienvenida.css). La CSP solo deja cargar archivos del propio navegador: ninguna conexión.
     Las miniaturas se dibujan con las plantillas del final (como miniaturas.slint: solo rectángulos). -->
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src resource: chrome:; font-src resource: chrome:; img-src resource: chrome:; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="color-scheme" content="light dark" />
    <title data-l10n-id="aegis-bienvenida-pestana"></title>
    <link rel="icon" href="chrome://branding/content/icon32.png" />
    <link rel="localization" href="branding/brand.ftl" />
    <link rel="localization" href="aegis.ftl" />
  </head>
  <body>
    <div class="bienvenida-marca" aria-hidden="true">
      <span class="bienvenida-marca-icono"></span>
      <span data-l10n-id="aegis-bienvenida-nombre"></span>
    </div>

    <main class="bienvenida">
      <!-- 1. Bienvenida: el icono, el nombre y lo que se va a configurar (cada fila lleva a su paso). -->
      <section class="bienvenida-paso bienvenida-inicio" data-paso="0" aria-labelledby="bienvenida-titulo-0">
        <img class="bienvenida-logo" src="chrome://branding/content/about-logo.svg" alt="" />
        <h1 id="bienvenida-titulo-0" class="bienvenida-titulo bienvenida-titulo-grande" tabindex="-1"
            data-l10n-id="aegis-bienvenida-nombre"></h1>
        <p class="bienvenida-subtitulo" data-l10n-id="aegis-bienvenida-lema"></p>
        <h2 id="bienvenida-resumen-titulo" class="bienvenida-seccion" data-l10n-id="aegis-bienvenida-resumen"></h2>
        <ul class="bienvenida-grupo" aria-labelledby="bienvenida-resumen-titulo">
          <li>
            <button type="button" class="bienvenida-fila" data-ir="1">
              <span class="bienvenida-glifo" data-icono="modo"></span>
              <span class="bienvenida-fila-nombre" data-l10n-id="aegis-bienvenida-fila-modo"></span>
              <span class="bienvenida-fila-valor" data-valor="modo"></span>
              <span class="bienvenida-chevron"></span>
            </button>
          </li>
          <li>
            <button type="button" class="bienvenida-fila" data-ir="2">
              <span class="bienvenida-glifo" data-icono="escudos"></span>
              <span class="bienvenida-fila-nombre" data-l10n-id="aegis-bienvenida-fila-escudos"></span>
              <span class="bienvenida-fila-valor" data-valor="escudos"></span>
              <span class="bienvenida-chevron"></span>
            </button>
          </li>
          <li>
            <button type="button" class="bienvenida-fila" data-ir="3">
              <span class="bienvenida-glifo" data-icono="buscador"></span>
              <span class="bienvenida-fila-nombre" data-l10n-id="aegis-bienvenida-fila-buscador"></span>
              <span class="bienvenida-fila-valor" data-valor="buscador"></span>
              <span class="bienvenida-chevron"></span>
            </button>
          </li>
          <li>
            <button type="button" class="bienvenida-fila" data-ir="4">
              <span class="bienvenida-glifo" data-icono="apariencia"></span>
              <span class="bienvenida-fila-nombre" data-l10n-id="aegis-bienvenida-fila-apariencia"></span>
              <span class="bienvenida-fila-valor" data-valor="apariencia"></span>
              <span class="bienvenida-chevron"></span>
            </button>
          </li>
        </ul>
        <p class="bienvenida-nota" data-l10n-id="aegis-bienvenida-resumen-nota"></p>
      </section>

      <!-- 2. Cómo navegar: Estándar o Workflow. -->
      <section class="bienvenida-paso" data-paso="1" aria-labelledby="bienvenida-titulo-1" hidden="">
        <div class="bienvenida-icono" data-icono="modo"></div>
        <h1 id="bienvenida-titulo-1" class="bienvenida-titulo" tabindex="-1"
            data-l10n-id="aegis-bienvenida-modo-titulo"></h1>
        <p class="bienvenida-subtitulo" data-l10n-id="aegis-bienvenida-modo-subtitulo"></p>
        <div class="bienvenida-tarjetas bienvenida-tarjetas-anchas" role="radiogroup"
             aria-labelledby="bienvenida-titulo-1">
          <label class="bienvenida-tarjeta">
            <input type="radio" name="modo" value="estandar"
                   aria-labelledby="bienvenida-modo-estandar" aria-describedby="bienvenida-modo-estandar-detalle" />
            <span class="bienvenida-lamina">
              <span class="bienvenida-mini" data-mini="estandar"></span>
            </span>
            <span id="bienvenida-modo-estandar" class="bienvenida-tarjeta-nombre"
                  data-l10n-id="aegis-bienvenida-modo-estandar"></span>
            <span id="bienvenida-modo-estandar-detalle" class="bienvenida-tarjeta-detalle"
                  data-l10n-id="aegis-bienvenida-modo-estandar-detalle"></span>
          </label>
          <label class="bienvenida-tarjeta">
            <input type="radio" name="modo" value="workflow"
                   aria-labelledby="bienvenida-modo-workflow" aria-describedby="bienvenida-modo-workflow-detalle" />
            <span class="bienvenida-lamina">
              <span class="bienvenida-mini" data-mini="workflow"></span>
            </span>
            <span id="bienvenida-modo-workflow" class="bienvenida-tarjeta-nombre"
                  data-l10n-id="aegis-bienvenida-modo-workflow"></span>
            <span id="bienvenida-modo-workflow-detalle" class="bienvenida-tarjeta-detalle"
                  data-l10n-id="aegis-bienvenida-modo-workflow-detalle"></span>
          </label>
        </div>
        <p id="bienvenida-modo-nota" class="bienvenida-nota bienvenida-nota-ancha"
           data-l10n-id="aegis-bienvenida-modo-nota-estandar"></p>
      </section>

      <!-- 3. Escudos: Normal, Estricto o Estricto+ (el de serie y el recomendado). -->
      <section class="bienvenida-paso" data-paso="2" aria-labelledby="bienvenida-titulo-2" hidden="">
        <div class="bienvenida-icono" data-icono="escudos"></div>
        <h1 id="bienvenida-titulo-2" class="bienvenida-titulo" tabindex="-1"
            data-l10n-id="aegis-bienvenida-escudos-titulo"></h1>
        <p class="bienvenida-subtitulo" data-l10n-id="aegis-bienvenida-escudos-subtitulo"></p>
        <div class="bienvenida-tarjetas bienvenida-con-insignia" role="radiogroup"
             aria-labelledby="bienvenida-titulo-2">
          <label class="bienvenida-tarjeta">
            <input type="radio" name="escudos" value="normal"
                   aria-labelledby="bienvenida-escudos-normal" aria-describedby="bienvenida-escudos-normal-detalle" />
            <span class="bienvenida-lamina">
              <span class="bienvenida-mini" data-mini="escudos" data-nivel="0" data-cifra="8"></span>
            </span>
            <span id="bienvenida-escudos-normal" class="bienvenida-tarjeta-nombre"
                  data-l10n-id="aegis-bienvenida-escudos-normal"></span>
            <span id="bienvenida-escudos-normal-detalle" class="bienvenida-tarjeta-detalle"
                  data-l10n-id="aegis-bienvenida-escudos-normal-detalle"></span>
          </label>
          <label class="bienvenida-tarjeta">
            <input type="radio" name="escudos" value="estricto"
                   aria-labelledby="bienvenida-escudos-estricto"
                   aria-describedby="bienvenida-escudos-estricto-detalle" />
            <span class="bienvenida-lamina">
              <span class="bienvenida-mini" data-mini="escudos" data-nivel="1" data-cifra="15"></span>
            </span>
            <span id="bienvenida-escudos-estricto" class="bienvenida-tarjeta-nombre"
                  data-l10n-id="aegis-bienvenida-escudos-estricto"></span>
            <span id="bienvenida-escudos-estricto-detalle" class="bienvenida-tarjeta-detalle"
                  data-l10n-id="aegis-bienvenida-escudos-estricto-detalle"></span>
          </label>
          <label class="bienvenida-tarjeta">
            <!-- El nombre accesible lleva «(recomendado)»: la insignia es parte del dibujo. -->
            <input type="radio" name="escudos" value="estricto_mas"
                   data-l10n-id="aegis-bienvenida-escudos-estricto-mas-accesible"
                   aria-describedby="bienvenida-escudos-estricto-mas-detalle" />
            <span class="bienvenida-lamina">
              <span class="bienvenida-mini" data-mini="escudos" data-nivel="2" data-cifra="23"></span>
              <span class="bienvenida-insignia" aria-hidden="true" data-l10n-id="aegis-bienvenida-recomendado"></span>
            </span>
            <span class="bienvenida-tarjeta-nombre" data-l10n-id="aegis-bienvenida-escudos-estricto-mas"></span>
            <span id="bienvenida-escudos-estricto-mas-detalle" class="bienvenida-tarjeta-detalle"
                  data-l10n-id="aegis-bienvenida-escudos-estricto-mas-detalle"></span>
          </label>
        </div>
        <p class="bienvenida-nota" data-l10n-id="aegis-bienvenida-escudos-nota"></p>
      </section>

      <!-- 4. Buscador: cuatro tarjetas compactas en rejilla de 2 × 2, solo texto (sin logotipos). Los nombres son
           marcas de sus buscadores: no se traducen. -->
      <section class="bienvenida-paso" data-paso="3" aria-labelledby="bienvenida-titulo-3" hidden="">
        <div class="bienvenida-icono" data-icono="buscador"></div>
        <h1 id="bienvenida-titulo-3" class="bienvenida-titulo" tabindex="-1"
            data-l10n-id="aegis-bienvenida-buscador-titulo"></h1>
        <p class="bienvenida-subtitulo" data-l10n-id="aegis-bienvenida-buscador-subtitulo"></p>
        <div class="bienvenida-rejilla" role="radiogroup" aria-labelledby="bienvenida-titulo-3" data-columnas="2">
          <label class="bienvenida-compacta">
            <input type="radio" name="buscador" value="duckduckgo"
                   aria-labelledby="bienvenida-buscador-duckduckgo"
                   aria-describedby="bienvenida-buscador-duckduckgo-detalle" />
            <span id="bienvenida-buscador-duckduckgo" class="bienvenida-tarjeta-nombre">DuckDuckGo</span>
            <span id="bienvenida-buscador-duckduckgo-detalle" class="bienvenida-tarjeta-detalle"
                  data-l10n-id="aegis-bienvenida-buscador-duckduckgo"></span>
          </label>
          <label class="bienvenida-compacta">
            <input type="radio" name="buscador" value="startpage"
                   aria-labelledby="bienvenida-buscador-startpage"
                   aria-describedby="bienvenida-buscador-startpage-detalle" />
            <span id="bienvenida-buscador-startpage" class="bienvenida-tarjeta-nombre">Startpage</span>
            <span id="bienvenida-buscador-startpage-detalle" class="bienvenida-tarjeta-detalle"
                  data-l10n-id="aegis-bienvenida-buscador-startpage"></span>
          </label>
          <label class="bienvenida-compacta">
            <input type="radio" name="buscador" value="brave"
                   aria-labelledby="bienvenida-buscador-brave" aria-describedby="bienvenida-buscador-brave-detalle" />
            <span id="bienvenida-buscador-brave" class="bienvenida-tarjeta-nombre">Brave Search</span>
            <span id="bienvenida-buscador-brave-detalle" class="bienvenida-tarjeta-detalle"
                  data-l10n-id="aegis-bienvenida-buscador-brave"></span>
          </label>
          <label class="bienvenida-compacta">
            <input type="radio" name="buscador" value="google"
                   aria-labelledby="bienvenida-buscador-google" aria-describedby="bienvenida-buscador-google-detalle" />
            <span id="bienvenida-buscador-google" class="bienvenida-tarjeta-nombre">Google</span>
            <span id="bienvenida-buscador-google-detalle" class="bienvenida-tarjeta-detalle"
                  data-l10n-id="aegis-bienvenida-buscador-google"></span>
          </label>
        </div>
      </section>

      <!-- 5. Apariencia: Oscuro, Claro o Automático (mitad y mitad). -->
      <section class="bienvenida-paso" data-paso="4" aria-labelledby="bienvenida-titulo-4" hidden="">
        <div class="bienvenida-icono" data-icono="apariencia"></div>
        <h1 id="bienvenida-titulo-4" class="bienvenida-titulo" tabindex="-1"
            data-l10n-id="aegis-bienvenida-apariencia-titulo"></h1>
        <p class="bienvenida-subtitulo" data-l10n-id="aegis-bienvenida-apariencia-subtitulo"></p>
        <div class="bienvenida-tarjetas" role="radiogroup" aria-labelledby="bienvenida-titulo-4">
          <label class="bienvenida-tarjeta">
            <input type="radio" name="apariencia" value="oscuro"
                   aria-labelledby="bienvenida-apariencia-oscuro"
                   aria-describedby="bienvenida-apariencia-oscuro-detalle" />
            <span class="bienvenida-lamina">
              <span class="bienvenida-mini" data-mini="estandar" data-tono="oscuro"></span>
            </span>
            <span id="bienvenida-apariencia-oscuro" class="bienvenida-tarjeta-nombre"
                  data-l10n-id="aegis-bienvenida-apariencia-oscuro"></span>
            <span id="bienvenida-apariencia-oscuro-detalle" class="bienvenida-tarjeta-detalle"
                  data-l10n-id="aegis-bienvenida-apariencia-oscuro-detalle"></span>
          </label>
          <label class="bienvenida-tarjeta">
            <input type="radio" name="apariencia" value="claro"
                   aria-labelledby="bienvenida-apariencia-claro"
                   aria-describedby="bienvenida-apariencia-claro-detalle" />
            <span class="bienvenida-lamina">
              <span class="bienvenida-mini" data-mini="estandar" data-tono="claro"></span>
            </span>
            <span id="bienvenida-apariencia-claro" class="bienvenida-tarjeta-nombre"
                  data-l10n-id="aegis-bienvenida-apariencia-claro"></span>
            <span id="bienvenida-apariencia-claro-detalle" class="bienvenida-tarjeta-detalle"
                  data-l10n-id="aegis-bienvenida-apariencia-claro-detalle"></span>
          </label>
          <label class="bienvenida-tarjeta">
            <input type="radio" name="apariencia" value="auto"
                   aria-labelledby="bienvenida-apariencia-auto" aria-describedby="bienvenida-apariencia-auto-detalle" />
            <span class="bienvenida-lamina">
              <span class="bienvenida-mini-auto">
                <span class="bienvenida-mitad">
                  <span class="bienvenida-mini" data-mini="estandar" data-tono="oscuro"></span>
                </span>
                <span class="bienvenida-mitad">
                  <span class="bienvenida-mini" data-mini="estandar" data-tono="claro"></span>
                </span>
              </span>
            </span>
            <span id="bienvenida-apariencia-auto" class="bienvenida-tarjeta-nombre"
                  data-l10n-id="aegis-bienvenida-apariencia-auto"></span>
            <span id="bienvenida-apariencia-auto-detalle" class="bienvenida-tarjeta-detalle"
                  data-l10n-id="aegis-bienvenida-apariencia-auto-detalle"></span>
          </label>
        </div>
        <p class="bienvenida-nota" data-l10n-id="aegis-bienvenida-apariencia-nota"></p>
      </section>

      <!-- Tutorial de Workflow (bienvenida.sys.mjs): cuatro pasos que salen al terminar la bienvenida con Workflow
           elegido, y cuando se quiera desde Ajustes › Pestañas y navegación o con la acción «Ver el tutorial de
           Workflow» (about:bienvenida?tutorial). Cada paso: el icono, el título, el subtítulo y una chuleta de filas de
           40 (lo que se hace y, a la derecha, cómo). Solo cuenta lo que ya existe en Aegis. -->
      <section class="bienvenida-paso bienvenida-tutorial" data-tutorial="0" aria-labelledby="tutorial-titulo-0"
               hidden="">
        <div class="bienvenida-icono" data-icono="modo"></div>
        <h1 id="tutorial-titulo-0" class="bienvenida-titulo" tabindex="-1"
            data-l10n-id="aegis-tutorial-pestanas-titulo"></h1>
        <p class="bienvenida-subtitulo" data-l10n-id="aegis-tutorial-pestanas-subtitulo"></p>
        <ul class="bienvenida-grupo bienvenida-chuleta" aria-labelledby="tutorial-titulo-0">
          <li class="bienvenida-fila-estatica">
            <span class="bienvenida-fila-nombre" data-l10n-id="aegis-tutorial-pestanas-plegar"></span>
            <span class="bienvenida-fila-valor" data-l10n-id="aegis-tutorial-pestanas-plegar-como"></span>
          </li>
          <li class="bienvenida-fila-estatica">
            <span class="bienvenida-fila-nombre" data-l10n-id="aegis-tutorial-pestanas-nueva"></span>
            <span class="bienvenida-fila-valor" data-l10n-id="aegis-tutorial-pestanas-nueva-como"></span>
          </li>
          <li class="bienvenida-fila-estatica">
            <span class="bienvenida-fila-nombre" data-l10n-id="aegis-tutorial-pestanas-cambiar"></span>
            <span class="bienvenida-fila-valor" data-l10n-id="aegis-tutorial-pestanas-cambiar-como"></span>
          </li>
        </ul>
      </section>

      <section class="bienvenida-paso bienvenida-tutorial" data-tutorial="1" aria-labelledby="tutorial-titulo-1"
               hidden="">
        <div class="bienvenida-icono" data-icono="fijar"></div>
        <h1 id="tutorial-titulo-1" class="bienvenida-titulo" tabindex="-1"
            data-l10n-id="aegis-tutorial-ordenar-titulo"></h1>
        <p class="bienvenida-subtitulo" data-l10n-id="aegis-tutorial-ordenar-subtitulo"></p>
        <ul class="bienvenida-grupo bienvenida-chuleta" aria-labelledby="tutorial-titulo-1">
          <li class="bienvenida-fila-estatica">
            <span class="bienvenida-fila-nombre" data-l10n-id="aegis-tutorial-ordenar-mover"></span>
            <span class="bienvenida-fila-valor" data-l10n-id="aegis-tutorial-ordenar-mover-como"></span>
          </li>
          <li class="bienvenida-fila-estatica">
            <span class="bienvenida-fila-nombre" data-l10n-id="aegis-tutorial-ordenar-fijar"></span>
            <span class="bienvenida-fila-valor" data-l10n-id="aegis-tutorial-ordenar-fijar-como"></span>
          </li>
          <li class="bienvenida-fila-estatica">
            <span class="bienvenida-fila-nombre" data-l10n-id="aegis-tutorial-ordenar-grupo"></span>
            <span class="bienvenida-fila-valor" data-l10n-id="aegis-tutorial-ordenar-grupo-como"></span>
          </li>
        </ul>
      </section>

      <section class="bienvenida-paso bienvenida-tutorial" data-tutorial="2" aria-labelledby="tutorial-titulo-2"
               hidden="">
        <div class="bienvenida-icono" data-icono="contenedor"></div>
        <h1 id="tutorial-titulo-2" class="bienvenida-titulo" tabindex="-1"
            data-l10n-id="aegis-tutorial-contenedores-titulo"></h1>
        <p class="bienvenida-subtitulo" data-l10n-id="aegis-tutorial-contenedores-subtitulo"></p>
        <ul class="bienvenida-grupo bienvenida-chuleta" aria-labelledby="tutorial-titulo-2">
          <li class="bienvenida-fila-estatica">
            <span class="bienvenida-fila-nombre" data-l10n-id="aegis-tutorial-contenedores-cambiar"></span>
            <span class="bienvenida-fila-valor" data-l10n-id="aegis-tutorial-contenedores-cambiar-como"></span>
          </li>
          <li class="bienvenida-fila-estatica">
            <span class="bienvenida-fila-nombre" data-l10n-id="aegis-tutorial-contenedores-nueva"></span>
            <span class="bienvenida-fila-valor" data-l10n-id="aegis-tutorial-contenedores-nueva-como"></span>
          </li>
          <li class="bienvenida-fila-estatica">
            <span class="bienvenida-fila-nombre" data-l10n-id="aegis-tutorial-contenedores-enlace"></span>
            <span class="bienvenida-fila-valor" data-l10n-id="aegis-tutorial-contenedores-enlace-como"></span>
          </li>
        </ul>
        <p class="bienvenida-nota bienvenida-nota-ancha" data-l10n-id="aegis-tutorial-contenedores-nota"></p>
      </section>

      <section class="bienvenida-paso bienvenida-tutorial" data-tutorial="3" aria-labelledby="tutorial-titulo-3"
               hidden="">
        <div class="bienvenida-icono" data-icono="acciones"></div>
        <h1 id="tutorial-titulo-3" class="bienvenida-titulo" tabindex="-1"
            data-l10n-id="aegis-tutorial-acciones-titulo"></h1>
        <p class="bienvenida-subtitulo" data-l10n-id="aegis-tutorial-acciones-subtitulo"></p>
        <ul class="bienvenida-grupo bienvenida-chuleta" aria-labelledby="tutorial-titulo-3">
          <li class="bienvenida-fila-estatica">
            <span class="bienvenida-fila-nombre" data-l10n-id="aegis-tutorial-acciones-abrir"></span>
            <span class="bienvenida-fila-valor" data-l10n-id="aegis-tutorial-acciones-abrir-como"></span>
          </li>
          <li class="bienvenida-fila-estatica">
            <span class="bienvenida-fila-nombre" data-l10n-id="aegis-tutorial-acciones-modo"></span>
            <span class="bienvenida-fila-valor" data-l10n-id="aegis-tutorial-acciones-modo-como"></span>
          </li>
          <li class="bienvenida-fila-estatica">
            <span class="bienvenida-fila-nombre" data-l10n-id="aegis-tutorial-acciones-contenedor"></span>

        <p class="bienvenida-nota bienvenida-nota-ancha" data-l10n-id="aegis-tutorial-acciones-nota"></p>
      </section>
    </main>

    <!-- «Saltar el tutorial», arriba a la derecha (frente a la marca): solo en el tutorial. -->
    <button type="button" id="bienvenida-saltar" class="bienvenida-saltar" data-l10n-id="aegis-tutorial-saltar"
            hidden=""></button>

    <!-- Pie fijo, como el del instalador: los pasos en rayitas, «Paso N de 5» y los dos botones (uno principal). -->
    <footer class="bienvenida-pie">
      <div id="bienvenida-rayitas" class="bienvenida-rayitas" aria-hidden="true">
        <span></span><span></span><span></span><span></span><span></span>
      </div>
      <p id="bienvenida-paso-n" class="bienvenida-paso-n"
         data-l10n-id="aegis-bienvenida-paso" data-l10n-args='{"n": 1, "total": 5}'></p>
      <div class="bienvenida-botones">
        <button type="button" id="bienvenida-secundario" class="bienvenida-secundario"
                data-l10n-id="aegis-bienvenida-personalizar"></button>
        <button type="button" id="bienvenida-principal" class="bienvenida-principal"
                data-l10n-id="aegis-bienvenida-usar-recomendado"></button>
      </div>
    </footer>

    <!-- Miniaturas (miniaturas.slint): el navegador en Estándar (pestañas arriba, barra de direcciones y marcadores),
         en Workflow (barra lateral con pestañas verticales; los espacios y los esenciales aún no existen) y los Escudos (la barra con el
         botón y su contador, y las peticiones de la página, tachadas las bloqueadas). Todo decorativo. -->
    <template id="bienvenida-plantilla-estandar">
      <span class="m-pestana m-activa"><span class="m-raya"></span></span>
      <span class="m-pestana m-otra m-otra-1"><span class="m-raya"></span></span>
      <span class="m-pestana m-otra m-otra-2"><span class="m-raya"></span></span>
      <span class="m-punto m-punto-1"></span>
      <span class="m-punto m-punto-2"></span>
      <span class="m-punto m-punto-3"></span>
      <span class="m-direccion"><span class="m-raya"></span></span>
      <span class="m-boton"></span>
      <span class="m-marcadores"><span class="m-raya m-m1"></span><span class="m-raya m-m2"></span><span class="m-raya m-m3"></span><span class="m-raya m-m4"></span></span>
      <span class="m-hoja">
        <span class="m-raya m-titular"></span>
        <span class="m-raya m-linea m-l1"></span><span class="m-raya m-linea m-l2"></span>
        <span class="m-raya m-linea m-l3"></span><span class="m-raya m-linea m-l4"></span>
      </span>
    </template>
    <template id="bienvenida-plantilla-workflow">
      <span class="m-buscar"><span class="m-raya"></span></span>
      <span class="m-vertical m-v1"><span class="m-icono"></span><span class="m-raya"></span></span>
      <span class="m-vertical m-v2"><span class="m-icono"></span><span class="m-raya"></span></span>
      <span class="m-vertical m-v3"><span class="m-icono"></span><span class="m-raya"></span></span>
      <span class="m-vertical m-v4"><span class="m-icono"></span><span class="m-raya"></span></span>
      <span class="m-vertical m-v5"><span class="m-icono"></span><span class="m-raya"></span></span>
      <span class="m-vertical m-v6"><span class="m-icono"></span><span class="m-raya"></span></span>
      <span class="m-hoja m-hoja-lateral">
        <span class="m-raya m-titular"></span>
        <span class="m-raya m-linea m-l1"></span><span class="m-raya m-linea m-l2"></span><span class="m-raya m-linea m-l3"></span>
        <span class="m-raya m-linea m-l4"></span><span class="m-raya m-linea m-l5"></span><span class="m-raya m-linea m-l6"></span>
      </span>
    </template>
    <template id="bienvenida-plantilla-escudos">
      <span class="m-direccion m-direccion-escudos"><span class="m-raya"></span></span>
      <span class="m-anillo"></span>
      <span class="m-contador"><span class="m-cifra"></span></span>
      <span class="m-pagina">
        <span class="m-peticion m-p1"><span class="m-icono"></span><span class="m-raya"></span><span class="m-tachado"></span></span>
        <span class="m-peticion m-p2"><span class="m-icono"></span><span class="m-raya"></span><span class="m-tachado"></span></span>
        <span class="m-peticion m-p3"><span class="m-icono"></span><span class="m-raya"></span><span class="m-tachado"></span></span>
        <span class="m-peticion m-p4"><span class="m-icono"></span><span class="m-raya"></span><span class="m-tachado"></span></span>
        <span class="m-peticion m-p5"><span class="m-icono"></span><span class="m-raya"></span><span class="m-tachado"></span></span>
      </span>
    </template>
  </body>
