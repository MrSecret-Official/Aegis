<!-- Aegis · Tor: tres anillos concéntricos (las capas de la cebolla), glifo de línea monocromo (rejilla de 24, trazo
     de 1,5, extremos redondos; DISENO §8). No es el logotipo de Tor: es un glifo propio que lo evoca. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="context-fill"
     stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <circle cx="12" cy="12" r="8.25"/>
  <circle cx="12" cy="12" r="5.25"/>
  <circle cx="12" cy="12" r="2.25"/>
</svg>
