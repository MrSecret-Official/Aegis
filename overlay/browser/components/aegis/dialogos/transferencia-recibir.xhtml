<!-- Aegis · «Recibir de otro Aegis» (contrasenas/transferencia/transferencia.sys.mjs, abrirRecibir): abre el paquete
     .aegisvault con su código de 6 palabras y mete las contraseñas en la bóveda. Lo abren Ajustes › Contraseñas y
     autorrelleno y la página de las contraseñas del asistente de importar (con el archivo ya elegido). La lógica, en
     transferencia-recibir.mjs; el aspecto, dialogo.css (común) y transferencia.css. Textos: aegis.ftl
     («aegis-recibir-*», «aegis-transferencia-*»).
     La CSP no deja cargar nada salvo los scripts, las hojas y los glifos del propio navegador, ni conectar con nada
     (connect-src 'none') ni enviar el formulario a ninguna parte. -->
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src chrome:; style-src chrome: resource:; img-src chrome:; font-src chrome:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="color-scheme" content="light dark" />
    <title data-l10n-id="aegis-recibir-ventana"></title>
    <link rel="stylesheet" href="resource:///modules/aegis/estilos/tokens.css" />
    <link rel="stylesheet" href="chrome://browser/content/aegis/dialogo.css" />
    <link rel="stylesheet" href="chrome://browser/content/aegis/transferencia.css" />
    <link rel="localization" href="branding/brand.ftl" />
    <link rel="localization" href="aegis.ftl" />
    <script type="module" src="chrome://browser/content/aegis/transferencia-recibir.mjs"></script>
  </head>
  <body>
    <form id="formulario" class="principal" novalidate="novalidate" autocomplete="off">
      <header class="cabecera">
        <div class="icono" aria-hidden="true"></div>
        <h1 id="titulo" data-l10n-id="aegis-recibir-titulo"></h1>
        <p id="explicacion" class="explicacion" data-l10n-id="aegis-recibir-explicacion"></p>
      </header>

      <!-- Paso 1: el archivo y el código. -->
      <div id="paso-datos">
        <div class="campo">
          <span id="etiqueta-archivo" class="etiqueta" data-l10n-id="aegis-recibir-archivo"></span>
          <div class="archivo" role="group" aria-labelledby="etiqueta-archivo">
            <span id="nombre-archivo" class="nombre" data-vacio="" data-l10n-id="aegis-recibir-sin-archivo"></span>
            <button type="button" id="elegir" class="compacto" aria-describedby="nombre-archivo"
                    data-l10n-id="aegis-recibir-elegir"></button>
          </div>
        </div>
        <div class="campo">
          <label for="codigo" data-l10n-id="aegis-recibir-codigo"></label>
          <div class="caja">
            <input id="codigo" class="sin-boton" type="text" lang="en" autocomplete="off" spellcheck="false"
                   autocapitalize="none" aria-describedby="nota-codigo" />
          </div>
          <p id="nota-codigo" class="nota" aria-live="polite" data-l10n-id="aegis-recibir-codigo-nota"></p>
        </div>
        <p class="limites" data-l10n-id="aegis-recibir-limites"></p>
      </div>

      <!-- Paso 2: qué ha entrado y borrar el archivo. -->
      <div id="paso-resumen" hidden="hidden">
        <ul id="resumen" class="resumen"></ul>
        <section class="aviso" aria-labelledby="borrar-titulo">
          <h2 id="borrar-titulo" data-l10n-id="aegis-recibir-borrar-titulo"></h2>
          <p data-l10n-id="aegis-recibir-borrar-texto"></p>
          <div class="borrar">
            <button type="button" id="borrar" class="compacto" data-l10n-id="aegis-recibir-borrar"></button>
            <p id="estado-borrar" class="nota" aria-live="polite" hidden="hidden"></p>
          </div>
        </section>
      </div>

      <p id="error-general" class="error" role="alert" hidden="hidden"></p>
      <footer class="acciones">
        <button type="button" id="cancelar" class="secundario" data-l10n-id="aegis-transferencia-cancelar"></button>
        <button type="submit" id="recibir" class="primario" disabled="disabled" data-l10n-id="aegis-recibir-boton"></button>
        <button type="button" id="hecho" class="primario" hidden="hidden" data-l10n-id="aegis-transferencia-hecho"></button>
      </footer>
    </form>
  </body>
</html>
