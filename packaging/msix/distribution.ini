; Aegis · distribución del paquete MSIX (Microsoft Store).
; tools/aegis.py msix la pone en lugar de la de la plantilla de Firefox
; (browser/installer/windows/msix/distribution/distribution.ini), que identifica el paquete como «mozilla-MSIX» y
; escribe un texto de Mozilla en la ventana «Acerca de». Solo «id» es obligatorio; sin «about», «Acerca de» no
; muestra texto de distribución. Ver docs/TIENDA.md.

[Global]
id=aegis-msix
version=1.0

[Preferences]
; Como en la plantilla de Firefox: en el paquete, Aegis usa el idioma de Windows y deja cambiarlo.
intl.locale.requested=""
intl.multilingual.enabled=true
